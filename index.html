<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mi Cartera</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cartera">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f6f6f4; --card:#fff; --card2:#f1f1ee; --line:rgba(11,11,11,.10);
  --tx:#0b0b0b; --tx2:#5f5e5a; --tx3:#8a8984;
  --up:#0f7a3d; --dn:#c0392b; --accent:#2a78d6;
  --safeT:env(safe-area-inset-top); --safeB:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0b0b0c; --card:#18181a; --card2:#202023; --line:rgba(255,255,255,.10);
    --tx:#f5f5f3; --tx2:#a3a29c; --tx3:#76756f; --up:#4ade80; --dn:#f87171; --accent:#5c9df0; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);
  font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  padding:calc(var(--safeT) + 8px) 16px calc(var(--safeB) + 96px);
  max-width:560px;margin:0 auto;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hd h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.2px}
.sub{font-size:12px;color:var(--tx3);margin-top:1px}
.ico{background:var(--card);border:.5px solid var(--line);color:var(--tx2);
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent;color:var(--tx2);font:500 14px/1 inherit;
  padding:9px 0;border-radius:8px;cursor:pointer}
.seg button[aria-selected=true]{background:var(--card);color:var(--tx);
  box-shadow:0 1px 3px rgba(0,0,0,.10)}
.card{background:var(--card);border:.5px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.lbl{font-size:13px;color:var(--tx2)}
.big{font-size:36px;font-weight:600;letter-spacing:-1.1px;line-height:1.1;margin:3px 0 0}
.chg{display:flex;gap:9px;align-items:baseline;margin-top:7px;font-size:15px;font-weight:500}
.up{color:var(--up)} .dn{color:var(--dn)}
.pill{font-size:13px;padding:2px 8px;border-radius:20px;background:var(--card2);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.mini{background:var(--card2);border-radius:11px;padding:12px}
.mini .lbl{font-size:12px}
.mini .v{font-size:17px;font-weight:600;margin-top:2px;letter-spacing:-.3px}
h2{font-size:13px;font-weight:500;color:var(--tx2);margin:20px 4px 9px;letter-spacing:.02em}
.donut{display:flex;align-items:center;gap:16px}
.dwrap{position:relative;width:118px;height:118px;flex:0 0 118px}
.dctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dctr b{font-size:15px;font-weight:600;letter-spacing:-.3px}
.dctr span{font-size:10px;color:var(--tx3)}
.lg{display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--tx2);min-width:0;flex:1}
.lg div{display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:.5px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.lo{width:36px;height:36px;border-radius:10px;flex:0 0 36px;object-fit:contain;background:#fff;padding:3px;border:.5px solid var(--line)}
.av{width:36px;height:36px;border-radius:10px;flex:0 0 36px;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:600;background:var(--card2);color:var(--tx2);letter-spacing:-.3px}
.mid{flex:1;min-width:0}
.tk{font-size:15px;font-weight:600;letter-spacing:-.2px}
.mt{font-size:12px;color:var(--tx3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{text-align:right;flex:0 0 auto}
.rv{font-size:15px;font-weight:600;letter-spacing:-.2px}
.rp{font-size:12px;margin-top:1px;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{background:var(--card);border:.5px solid var(--line);border-radius:14px;padding:13px}
.tcard h3{font-size:11px;font-weight:600;color:var(--tx3);margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em}
.tline{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;padding:3px 0}
.tline b{font-weight:500;color:var(--tx)}
.bar{height:5px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:3px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safeB) + 18px);
  background:var(--tx);color:var(--bg);border:0;border-radius:26px;padding:14px 26px;
  font:600 14px/1 inherit;box-shadow:0 6px 22px rgba(0,0,0,.26);cursor:pointer;z-index:40}
.fab:disabled{opacity:.55}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{background:var(--bg);width:100%;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:8px 16px calc(var(--safeB) + 24px);transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-width:560px;margin:0 auto;-webkit-overflow-scrolling:touch}
.ov.on .sheet{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:8px auto 14px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:right;color:var(--tx3);font-weight:500;padding:6px 0;font-size:11px;
  border-bottom:.5px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:7px 0;border-bottom:.5px solid var(--line);text-align:right}
input{width:100%;padding:12px;border-radius:10px;border:.5px solid var(--line);
  background:var(--card);color:var(--tx);font:400 15px/1 inherit;margin-top:6px}
.btn{width:100%;padding:14px;border-radius:12px;border:0;background:var(--tx);color:var(--bg);
  font:600 15px/1 inherit;margin-top:14px;cursor:pointer}
.btn.alt{background:var(--card2);color:var(--tx);border:.5px solid var(--line)}
.err{background:rgba(192,57,43,.12);color:var(--dn);padding:12px;border-radius:10px;font-size:13.5px;margin-bottom:12px}
.sk{background:var(--card2);border-radius:8px;animation:p 1.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.55}50%{opacity:1}}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="app" class="hidden">
  <div class="hd">
    <div>
      <h1>Mi cartera</h1>
      <div class="sub" id="upd">—</div>
    </div>
    <button class="ico" id="cfg" aria-label="Ajustes">⚙</button>
  </div>

  <div class="seg" role="tablist">
    <button role="tab" id="tabC" aria-selected="true">Cartera</button>
    <button role="tab" id="tabP" aria-selected="false">Patrimonio</button>
  </div>

  <div id="err"></div>

  <div class="card">
    <div class="lbl" id="heroLbl">Valor total</div>
    <div class="big" id="heroVal">—</div>
    <div class="chg" id="heroChg"></div>
    <div class="grid2" id="minis"></div>
  </div>

  <h2 id="hDist">Distribución</h2>
  <div class="card">
    <div class="donut">
      <div class="dwrap">
        <canvas id="donut" width="236" height="236"></canvas>
        <div class="dctr"><b id="dcv">—</b><span id="dcl">total</span></div>
      </div>
      <div class="lg" id="leg"></div>
    </div>
  </div>

  <h2 id="hPos">Posiciones</h2>
  <div class="card" id="pos"></div>

  <div id="topsWrap">
    <h2>Mejores y peores</h2>
    <div class="two">
      <div class="tcard"><h3>Ganadores</h3><div id="win"></div></div>
      <div class="tcard"><h3>Perdedores</h3><div id="los"></div></div>
    </div>
  </div>

  <div id="claseWrap">
    <h2>P&amp;L histórico por clase</h2>
    <div class="card" id="clase"></div>
  </div>

  <button class="fab" id="refresh">Actualizar</button>
</div>

<div id="setup" class="hidden" style="padding-top:36px">
  <h1 style="font-size:22px;font-weight:600;margin:0 0 6px">Conectar planilla</h1>
  <p style="color:var(--tx2);font-size:14px;margin:0 0 20px">
    Pegá la URL de tu app web de Apps Script y el token. Se guardan solo en este teléfono.
  </p>
  <div id="setupErr"></div>
  <label class="lbl">URL de la app web</label>
  <input id="inUrl" type="url" inputmode="url" autocapitalize="off" autocorrect="off"
         placeholder="https://script.google.com/macros/s/.../exec">
  <label class="lbl" style="display:block;margin-top:14px">Token</label>
  <input id="inTok" type="text" autocapitalize="off" autocorrect="off" placeholder="tu-token-secreto">
  <button class="btn" id="save">Guardar y cargar</button>
  <button class="btn alt hidden" id="cancel">Cancelar</button>
</div>

<div class="ov" id="ov"><div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const K_URL='cartera.url', K_TOK='cartera.token', K_DATA='cartera.data';
const $=id=>document.getElementById(id);
let D=null, vista='cartera', chart=null;

const COL=['#2a78d6','#eb6834','#1baf7a','#eda100','#d55181','#7f77dd','#888780','#639922'];

const DOM={MELI:'mercadolibre.com',NFLX:'netflix.com',SPOT:'spotify.com',CRM:'salesforce.com',
ADBE:'adobe.com',MSFT:'microsoft.com',ORCL:'oracle.com',META:'meta.com',NU:'nubank.com.br',
GLOB:'globant.com',NKE:'nike.com',MA:'mastercard.com',ABT:'abbott.com',HD:'homedepot.com',
SPCX:'spacex.com',BABA:'alibaba.com',PG:'pg.com',PLTR:'palantir.com',PEP:'pepsico.com',
COIN:'coinbase.com',MSTR:'strategy.com',MCD:'mcdonalds.com',SONY:'sony.com',IBM:'ibm.com',
'BRK.B':'berkshirehathaway.com',SHOP:'shopify.com',UBER:'uber.com',ACN:'accenture.com',
DIS:'disney.com',AAPL:'apple.com',GOOGL:'abc.xyz',AMZN:'amazon.com',TSLA:'tesla.com',
KO:'coca-cola.com',JNJ:'jnj.com',XOM:'exxonmobil.com',CVX:'chevron.com',PFE:'pfizer.com',
V:'visa.com',UNH:'unitedhealthgroup.com',VIST:'vistaenergy.com',GGAL:'galicia.ar',
BMA:'macro.com.ar',YPFD:'ypf.com',PAMP:'pampaenergia.com',METR:'metrogas.com.ar',
YM37D:'ypf.com',YM41D:'ypf.com',YM37O:'ypf.com',YM41O:'ypf.com',
VBC1D:'bancodevalores.com',VBC1O:'bancodevalores.com',PECND:'aconcaguaenergia.com',
PECIO:'aconcaguaenergia.com',TSM:'tsmc.com',AMGN:'amgen.com',CAT:'caterpillar.com',
MRK:'merck.com',MDLZ:'mondelezinternational.com',TGT:'target.com',UPS:'ups.com',
STZ:'cbrands.com',QCOM:'qualcomm.com',CMCSA:'comcast.com',LLY:'lilly.com',
OXY:'oxy.com',COP:'conocophillips.com',SHEL:'shell.com',TTE:'totalenergies.com',
NVO:'novonordisk.com',NVDA:'nvidia.com',AXP:'americanexpress.com',BAC:'bankofamerica.com',
INTC:'intel.com',TM:'toyota.com',ASML:'asml.com',PBR:'petrobras.com.br',VALE:'vale.com',
IRSA:'irsa.com.ar',CRES:'cresud.com.ar'};

const fUSD=(n,d=2)=>'US$ '+(n<0?'−':'')+Math.abs(n||0).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fUSD0=n=>'US$ '+(n<0?'−':'')+Math.abs(n||0).toLocaleString('es-AR',{maximumFractionDigits:0});
const fPct=n=>(n>0?'+':n<0?'−':'')+Math.abs(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
const cls=n=>n>0?'up':n<0?'dn':'';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function logo(tk){
  const d=DOM[tk];
  const ini=esc(tk).slice(0,tk.length>4?5:4);
  if(!d) return '<div class="av">'+ini+'</div>';
  return '<img class="lo" alt="" loading="lazy" src="https://logo.clearbit.com/'+d+'" '+
    'onerror="this.onerror=null;this.src=\'https://www.google.com/s2/favicons?sz=64&amp;domain='+d+'\';'+
    'this.dataset.f=(this.dataset.f||0)+1;if(this.dataset.f>1){this.outerHTML=\'<div class=&quot;av&quot;>'+ini+'</div>\'}">';
}

/* ---------- vistas ---------- */
function totales(){
  const t=D.totales;
  if(vista==='cartera'){
    return {
      titulo:'Valor de la cartera',
      valor:(t.subtotalValor||0)+(t.cash||0),
      pnl:t.subtotalPnl||0,
      pct:t.subtotalRend||0,
      minis:[['Invertido',fUSD0(t.subtotalCosto)],['Disponible',fUSD0(t.cash)]]
    };
  }
  return {
    titulo:'Patrimonio neto',
    valor:t.patrimonioNeto||0,
    pnl:D.resumen.pnlNetoTotal||0,
    pct:null,
    minis:[['Activos',fUSD0(t.totalCartera)],['Deudas',fUSD0(t.deudas)]]
  };
}

function grupos(){
  const g=(D.graficos&&D.graficos.grupos)||[];
  return vista==='cartera' ? g.filter(x=>!/auto/i.test(x.grupo)) : g.slice();
}

/* ---------- render ---------- */
function render(){
  $('upd').textContent = D.actualizado ? 'Actualizado '+D.actualizado : '';

  const T=totales();
  $('heroLbl').textContent=T.titulo;
  $('heroVal').textContent=fUSD(T.valor);
  $('heroChg').innerHTML =
    '<span class="'+cls(T.pnl)+'">'+(T.pnl>0?'+':'')+fUSD(T.pnl)+'</span>'+
    (T.pct===null?'':'<span class="pill '+cls(T.pct)+'">'+fPct(T.pct)+'</span>');
  $('minis').innerHTML=T.minis.map(m=>
    '<div class="mini"><div class="lbl">'+m[0]+'</div><div class="v">'+m[1]+'</div></div>').join('');

  renderDonut();

  const ps=D.posiciones.slice().sort((a,b)=>b.valorActual-a.valorActual);
  $('hPos').textContent='Posiciones · '+ps.length;
  $('pos').innerHTML=ps.map((p,i)=>
    '<div class="row" data-i="'+i+'">'+logo(p.ticker)+
      '<div class="mid"><div class="tk">'+esc(p.ticker)+'</div>'+
        '<div class="mt">'+esc(p.tipo)+' · '+p.peso.toLocaleString('es-AR',{maximumFractionDigits:2})+'%</div></div>'+
      '<div class="rt"><div class="rv">'+fUSD0(p.valorActual)+'</div>'+
        '<div class="rp '+cls(p.pnl)+'">'+(p.pnl>0?'+':'')+fUSD(p.pnl,2)+' · '+fPct(p.rend)+'</div></div>'+
    '</div>').join('');
  [...$('pos').children].forEach(el=>el.onclick=()=>detalle(ps[+el.dataset.i]));

  const mini=(arr,neg)=>{
    if(!arr||!arr.length) return '<div class="tline" style="color:var(--tx3)">Sin datos</div>';
    const mx=Math.max(...arr.map(x=>Math.abs(x.pnlNeto)))||1;
    return arr.slice(0,6).map(x=>
      '<div class="tline"><b>'+esc(x.ticker)+'</b><span class="'+(neg?'dn':'up')+'">'+
      (neg?'−':'+')+fUSD0(Math.abs(x.pnlNeto))+'</span></div>'+
      '<div class="bar"><i style="width:'+(Math.abs(x.pnlNeto)/mx*100).toFixed(1)+'%;background:'+
      (neg?'var(--dn)':'var(--up)')+'"></i></div>').join('');
  };
  $('win').innerHTML=mini(D.topGanadores,false);
  $('los').innerHTML=mini(D.topPerdedores,true);
  $('topsWrap').classList.toggle('hidden',!(D.topGanadores||[]).length&&!(D.topPerdedores||[]).length);

  const cl=D.pnlPorClase||[];
  $('claseWrap').classList.toggle('hidden',!cl.length);
  if(cl.length){
    $('clase').innerHTML=cl.map((c,i)=>
      '<div class="row" style="cursor:default">'+
        '<div class="sw" style="background:'+COL[i%COL.length]+';width:12px;height:12px;flex:0 0 12px"></div>'+
        '<div class="mid"><div class="tk" style="font-size:14px">'+esc(c.clase)+'</div>'+
          '<div class="mt">Operado '+fUSD0(c.capital)+' · rentas '+fUSD0(c.rentas)+'</div></div>'+
        '<div class="rt"><div class="rv '+cls(c.pnlNeto)+'">'+(c.pnlNeto>0?'+':'')+fUSD0(c.pnlNeto)+'</div>'+
          '<div class="rp '+cls(c.rendNeto)+'">'+fPct(c.rendNeto)+'</div></div>'+
      '</div>').join('');
  }
}

function renderDonut(){
  const g=grupos();
  const tot=g.reduce((a,b)=>a+b.valor,0);
  $('dcv').textContent=fUSD0(tot).replace('US$ ','');
  $('dcl').textContent='US$ total';
  $('leg').innerHTML=g.map((x,i)=>
    '<div><span class="sw" style="background:'+COL[i%COL.length]+'"></span>'+
    esc(x.grupo)+' '+(tot?(x.valor/tot*100).toFixed(1):0)+'%</div>').join('');
  if(chart) chart.destroy();
  chart=new Chart($('donut'),{
    type:'doughnut',
    data:{labels:g.map(x=>x.grupo),datasets:[{data:g.map(x=>x.valor),
      backgroundColor:g.map((_,i)=>COL[i%COL.length]),borderWidth:0,hoverOffset:5}]},
    options:{responsive:false,cutout:'70%',animation:{duration:420},
      plugins:{legend:{display:false},tooltip:{enabled:false}}}
  });
}

function detalle(p){
  const ops=(D.operaciones&&D.operaciones[p.ticker])||[];
  const fila=(k,v,c)=>'<div class="tline" style="padding:8px 0;border-bottom:.5px solid var(--line)">'+
    '<span style="color:var(--tx2)">'+k+'</span><b class="'+(c||'')+'">'+v+'</b></div>';
  $('sheetBody').innerHTML=
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">'+logo(p.ticker)+
      '<div><div style="font-size:19px;font-weight:600;letter-spacing:-.3px">'+esc(p.ticker)+'</div>'+
      '<div style="font-size:12.5px;color:var(--tx3)">'+esc(p.tipo)+'</div></div></div>'+
    '<div class="card" style="padding:14px 16px">'+
      fila('Valor actual',fUSD(p.valorActual))+
      fila('Costo',fUSD(p.costo))+
      fila('P&L no realizado',(p.pnl>0?'+':'')+fUSD(p.pnl),cls(p.pnl))+
      fila('Rendimiento',fPct(p.rend),cls(p.rend))+
      fila('Precio prom. compra',fUSD(p.precioProm))+
      fila('Precio actual',fUSD(p.precioActual))+
      (p.precioUSA?fila('Precio en USA',fUSD(p.precioUSA)):'')+
      (p.precioUSA?fila('Rendimiento vs USA',fPct(p.rendUSA),cls(p.rendUSA)):'')+
      fila('Peso en cartera',p.peso.toLocaleString('es-AR',{maximumFractionDigits:2})+'%')+
    '</div>'+
    (ops.length?
      '<h2 style="margin-left:0">Operaciones · '+ops.length+'</h2><div class="card" style="padding:4px 16px 12px">'+
      '<table><thead><tr><th>Fecha</th><th>Cant.</th><th>Compra</th><th>Rend.</th></tr></thead><tbody>'+
      ops.map(o=>'<tr><td>'+esc(o.fecha)+'</td>'+
        '<td>'+o.cantidad.toLocaleString('es-AR',{maximumFractionDigits:3})+'</td>'+
        '<td>'+fUSD(o.precioCompra).replace('US$ ','')+'</td>'+
        '<td class="'+cls(o.rend)+'">'+fPct(o.rend)+'</td></tr>').join('')+
      '</tbody></table></div>':'')+
    '<button class="btn alt" onclick="cerrar()">Cerrar</button>';
  $('ov').classList.add('on');
  $('sheet').scrollTop=0;
}
function cerrar(){$('ov').classList.remove('on')}
$('ov').onclick=e=>{if(e.target===$('ov'))cerrar()};

/* ---------- datos ---------- */
async function cargar(silencioso){
  const url=localStorage.getItem(K_URL), tok=localStorage.getItem(K_TOK);
  if(!url||!tok){mostrarSetup();return;}
  const b=$('refresh'); b.disabled=true; b.textContent='Actualizando…';
  $('err').innerHTML='';
  try{
    const r=await fetch(url+'?token='+encodeURIComponent(tok)+'&t='+Date.now(),{redirect:'follow'});
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||'Respuesta inválida');
    D=j; localStorage.setItem(K_DATA,JSON.stringify(j));
    render();
  }catch(e){
    const cache=localStorage.getItem(K_DATA);
    if(cache&&!D){D=JSON.parse(cache);render();}
    $('err').innerHTML='<div class="err">No se pudo actualizar: '+esc(e.message)+
      (cache?'<br>Mostrando los últimos datos guardados.':'')+'</div>';
  }finally{ b.disabled=false; b.textContent='Actualizar'; }
}

function mostrarSetup(editar){
  $('app').classList.add('hidden'); $('setup').classList.remove('hidden');
  $('inUrl').value=localStorage.getItem(K_URL)||'';
  $('inTok').value=localStorage.getItem(K_TOK)||'';
  $('cancel').classList.toggle('hidden',!editar);
}
function mostrarApp(){ $('setup').classList.add('hidden'); $('app').classList.remove('hidden'); }

$('save').onclick=async()=>{
  const u=$('inUrl').value.trim(), t=$('inTok').value.trim();
  $('setupErr').innerHTML='';
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u)){
    $('setupErr').innerHTML='<div class="err">La URL debe terminar en /exec y empezar con https://script.google.com/macros/s/</div>';return;
  }
  if(!t){$('setupErr').innerHTML='<div class="err">Falta el token.</div>';return;}
  localStorage.setItem(K_URL,u); localStorage.setItem(K_TOK,t);
  mostrarApp(); await cargar();
};
$('cancel').onclick=()=>{mostrarApp()};
$('cfg').onclick=()=>mostrarSetup(true);
$('refresh').onclick=()=>cargar();
$('tabC').onclick=()=>cambiar('cartera');
$('tabP').onclick=()=>cambiar('patrimonio');
function cambiar(v){
  vista=v;
  $('tabC').setAttribute('aria-selected',v==='cartera');
  $('tabP').setAttribute('aria-selected',v==='patrimonio');
  if(D) render();
}

(function init(){
  const cache=localStorage.getItem(K_DATA);
  if(localStorage.getItem(K_URL)&&localStorage.getItem(K_TOK)){
    mostrarApp();
    if(cache){try{D=JSON.parse(cache);render();}catch(e){}}
    cargar();
  }else{ mostrarSetup(); }
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
