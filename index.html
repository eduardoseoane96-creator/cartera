<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mi Cartera</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cartera">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f6f6f4; --card:#fff; --card2:#f1f1ee; --line:rgba(11,11,11,.10);
  --tx:#0b0b0b; --tx2:#5f5e5a; --tx3:#8a8984;
  --up:#0f7a3d; --dn:#c0392b; --live:#1baf7a;
  --safeT:env(safe-area-inset-top); --safeB:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0b0b0c; --card:#18181a; --card2:#202023; --line:rgba(255,255,255,.10);
    --tx:#f5f5f3; --tx2:#a3a29c; --tx3:#76756f; --up:#4ade80; --dn:#f87171; --live:#4ade80; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);
  font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  padding:calc(var(--safeT) + 8px) 16px calc(var(--safeB) + 96px);
  max-width:560px;margin:0 auto;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
}
.hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.hd h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.2px}
.sub{font-size:12px;color:var(--tx3);margin-top:2px;display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--live);flex:0 0 6px}
.ico{background:var(--card);border:.5px solid var(--line);color:var(--tx2);
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;flex:0 0 36px}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent;color:var(--tx2);font:500 13.5px/1 inherit;
  padding:9px 0;border-radius:8px;cursor:pointer}
.seg button[aria-selected=true]{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.10)}
.card{background:var(--card);border:.5px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.lbl{font-size:13px;color:var(--tx2)}
.big{font-size:36px;font-weight:600;letter-spacing:-1.1px;line-height:1.1;margin:3px 0 0}
.chg{display:flex;gap:9px;align-items:baseline;margin-top:7px;font-size:15px;font-weight:500;flex-wrap:wrap}
.up{color:var(--up)} .dn{color:var(--dn)}
.pill{font-size:13px;padding:2px 8px;border-radius:20px;background:var(--card2);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.mini{background:var(--card2);border-radius:11px;padding:12px}
.mini .lbl{font-size:12px}
.mini .v{font-size:17px;font-weight:600;margin-top:2px;letter-spacing:-.3px}
h2{font-size:13px;font-weight:500;color:var(--tx2);margin:20px 4px 9px;letter-spacing:.02em;
   display:flex;justify-content:space-between;align-items:center}
h2 span{font-size:12px;color:var(--tx3);font-weight:400}

.donut{display:flex;align-items:center;gap:18px}
.dwrap{position:relative;width:124px;height:124px;flex:0 0 124px}
.dwrap canvas{display:block;width:124px!important;height:124px!important}
.dctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:none;text-align:center}
.dctr b{font-size:14px;font-weight:600;letter-spacing:-.3px;line-height:1.15}
.dctr span{font-size:9.5px;color:var(--tx3);margin-top:1px}
.lg{display:flex;flex-direction:column;gap:9px;font-size:12px;color:var(--tx2);min-width:0;flex:1 1 auto}
.lg div{display:flex;align-items:flex-start;gap:7px;min-width:0}
.lg .sw{margin-top:4px}
.lg i{font-style:normal;min-width:0}
.lg em{font-style:normal;display:block;font-size:12.5px;color:var(--tx);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg b{font-weight:400;display:block;font-size:11.5px;color:var(--tx2);white-space:nowrap}
.sw{width:9px;height:9px;border-radius:3px;flex:0 0 9px}

.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:.5px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.lo{width:36px;height:36px;border-radius:10px;flex:0 0 36px;object-fit:contain;background:#fff;
  padding:3px;border:.5px solid var(--line)}
.av{width:36px;height:36px;border-radius:10px;flex:0 0 36px;display:flex;align-items:center;
  justify-content:center;font-size:10.5px;font-weight:600;background:var(--card2);color:var(--tx2);letter-spacing:-.3px}
.mid{flex:1 1 auto;min-width:0}
.tk{font-size:15px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:5px}
.mt{font-size:11.5px;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{text-align:right;flex:0 0 auto}
.rv{font-size:15px;font-weight:600;letter-spacing:-.2px}
.rp{font-size:11.5px;margin-top:2px;font-weight:500;white-space:nowrap}
.tag{font-size:9px;padding:1px 5px;border-radius:4px;background:var(--card2);color:var(--tx3);font-weight:500}
.tag.on{background:rgba(27,175,122,.15);color:var(--live)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{background:var(--card);border:.5px solid var(--line);border-radius:14px;padding:13px}
.tcard h3{font-size:10.5px;font-weight:600;color:var(--tx3);margin:0 0 8px;letter-spacing:.05em}
.tline{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;padding:3px 0}
.tline b{font-weight:500;color:var(--tx)}
.bar{height:5px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safeB) + 18px);
  background:var(--tx);color:var(--bg);border:0;border-radius:26px;padding:14px 26px;
  font:600 14px/1 inherit;box-shadow:0 6px 22px rgba(0,0,0,.26);cursor:pointer;z-index:40}
.fab:disabled{opacity:.55}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{background:var(--bg);width:100%;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:8px 16px calc(var(--safeB) + 24px);transform:translateY(100%);
  transition:transform .26s cubic-bezier(.32,.72,0,1);max-width:560px;margin:0 auto;-webkit-overflow-scrolling:touch}
.ov.on .sheet{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:8px auto 14px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:right;color:var(--tx3);font-weight:500;padding:6px 0;font-size:11px;border-bottom:.5px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:7px 0;border-bottom:.5px solid var(--line);text-align:right}
table.ops{font-size:11.5px;table-layout:fixed}
table.ops th{font-size:10px}
table.ops td{padding:7px 0 6px}
table.ops th:first-child,table.ops td:first-child{width:23%}
table.ops .na{color:var(--tx3)}
table.ops tr.viva td:first-child{position:relative;padding-left:8px}
table.ops tr.viva td:first-child::before{content:'';position:absolute;left:0;top:50%;
  transform:translateY(-50%);width:3px;height:3px;border-radius:50%;background:var(--up)}
input{width:100%;padding:12px;border-radius:10px;border:.5px solid var(--line);
  background:var(--card);color:var(--tx);font:400 15px/1 inherit;margin-top:6px}
.btn{width:100%;padding:14px;border-radius:12px;border:0;background:var(--tx);color:var(--bg);
  font:600 15px/1 inherit;margin-top:14px;cursor:pointer}
.btn.alt{background:var(--card2);color:var(--tx);border:.5px solid var(--line)}
.err{background:rgba(192,57,43,.12);color:var(--dn);padding:12px;border-radius:10px;font-size:13.5px;margin-bottom:12px}
.chips{display:flex;gap:7px;margin-bottom:12px}
.chips button{flex:1;border:.5px solid var(--line);background:var(--card);color:var(--tx2);
  font:500 12.5px/1 inherit;padding:9px 0;border-radius:9px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="app" class="hidden">
  <div class="hd">
    <div>
      <h1>Mi cartera</h1>
      <div class="sub" id="upd">—</div>
    </div>
    <button class="ico" id="cfg" aria-label="Ajustes">⚙</button>
  </div>

  <div class="seg" role="tablist">
    <button role="tab" id="tabC" aria-selected="true">Cartera</button>
    <button role="tab" id="tabP" aria-selected="false">Patrimonio</button>
    <button role="tab" id="tabH" aria-selected="false">Histórico</button>
  </div>

  <div id="err"></div>

  <div id="vistaCartera">
    <div class="card">
      <div class="lbl" id="heroLbl">Valor de la cartera</div>
      <div class="big" id="heroVal">—</div>
      <div class="chg" id="heroChg"></div>
      <div class="grid2" id="minis"></div>
    </div>

    <h2>Distribución</h2>
    <div class="card">
      <div class="donut">
        <div class="dwrap">
          <canvas id="donut"></canvas>
          <div class="dctr"><b id="dcv">—</b><span id="dcl">US$ total</span></div>
        </div>
        <div class="lg" id="leg"></div>
      </div>
    </div>

    <h2 id="hPos">Posiciones</h2>
    <div class="chips">
      <button id="oV" aria-pressed="true">Posición</button>
      <button id="oA" aria-pressed="false">P&amp;L US$</button>
      <button id="oR" aria-pressed="false">P&amp;L %</button>
    </div>
    <div class="card" id="pos"></div>

    <div id="topsWrap">
      <h2>Mejores y peores</h2>
      <div class="two">
        <div class="tcard"><h3>GANADORES</h3><div id="win"></div></div>
        <div class="tcard"><h3>PERDEDORES</h3><div id="los"></div></div>
      </div>
    </div>

    <div id="claseWrap">
      <h2>P&amp;L histórico por clase</h2>
      <div class="card" id="clase"></div>
    </div>
  </div>

  <div id="vistaHist" class="hidden">
    <div class="card">
      <div class="lbl">P&amp;L neto acumulado</div>
      <div class="big" id="hTot">—</div>
      <div class="chg" id="hSub"></div>
      <div class="grid2" id="hMinis"></div>
    </div>
    <div class="chips">
      <button id="fT" aria-pressed="true">Todas</button>
      <button id="fA" aria-pressed="false">Abiertas</button>
      <button id="fC" aria-pressed="false">Cerradas</button>
    </div>
    <div class="card" id="histList"></div>
  </div>

  <button class="fab" id="refresh">Actualizar</button>
</div>

<div id="setup" class="hidden" style="padding-top:36px">
  <h1 style="font-size:22px;font-weight:600;margin:0 0 6px">Conectar planilla</h1>
  <p style="color:var(--tx2);font-size:14px;margin:0 0 20px">
    Pegá la URL de tu app web de Apps Script y el token. Se guardan solo en este teléfono.
  </p>
  <div id="setupErr"></div>
  <label class="lbl">URL de la app web</label>
  <input id="inUrl" type="url" inputmode="url" autocapitalize="off" autocorrect="off"
         placeholder="https://script.google.com/macros/s/.../exec">
  <label class="lbl" style="display:block;margin-top:14px">Token</label>
  <input id="inTok" type="text" autocapitalize="off" autocorrect="off" placeholder="tu-token-secreto">
  <button class="btn" id="save">Guardar y cargar</button>
  <button class="btn alt hidden" id="cancel">Cancelar</button>
</div>

<div class="ov" id="ov"><div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const K_URL='cartera.url', K_TOK='cartera.token', K_DATA='cartera.data';
const $=id=>document.getElementById(id);
let D=null, vista='cartera', filtroH='todas', ordenPos='valor', chart=null;

const COL=['#2a78d6','#eb6834','#1baf7a','#eda100','#d55181','#7f77dd','#888780','#639922',
           '#00a3a3','#a35ac4','#b5892a'];

const DOM={MELI:'mercadolibre.com',NFLX:'netflix.com',SPOT:'spotify.com',CRM:'salesforce.com',
ADBE:'adobe.com',MSFT:'microsoft.com',ORCL:'oracle.com',META:'meta.com',NU:'nubank.com.br',
GLOB:'globant.com',NKE:'nike.com',MA:'mastercard.com',ABT:'abbott.com',HD:'homedepot.com',
SPCX:'spacex.com',BABA:'alibaba.com',PG:'pg.com',PLTR:'palantir.com',PEP:'pepsico.com',
COIN:'coinbase.com',MSTR:'strategy.com',MCD:'mcdonalds.com',SONY:'sony.com',IBM:'ibm.com',
'BRK.B':'berkshirehathaway.com',SHOP:'shopify.com',UBER:'uber.com',ACN:'accenture.com',
DIS:'disney.com',AAPL:'apple.com',GOOGL:'abc.xyz',AMZN:'amazon.com',TSLA:'tesla.com',
KO:'coca-cola.com',JNJ:'jnj.com',XOM:'exxonmobil.com',CVX:'chevron.com',PFE:'pfizer.com',
V:'visa.com',UNH:'unitedhealthgroup.com',VIST:'vistaenergy.com',GGAL:'galicia.ar',
BMA:'macro.com.ar',YPFD:'ypf.com',PAMP:'pampaenergia.com',METR:'metrogas.com.ar',
YM37D:'ypf.com',YM41D:'ypf.com',YM37O:'ypf.com',YM41O:'ypf.com',YPF:'ypf.com',
VBC1D:'bancodevalores.com',VBC1O:'bancodevalores.com',PECND:'aconcaguaenergia.com',
PECIO:'aconcaguaenergia.com',TSM:'tsmc.com',AMGN:'amgen.com',CAT:'caterpillar.com',
MRK:'merck.com',MDLZ:'mondelezinternational.com',TGT:'target.com',UPS:'ups.com',
STZ:'cbrands.com',QCOM:'qualcomm.com',CMCSA:'comcast.com',LLY:'lilly.com',OXY:'oxy.com',
COP:'conocophillips.com',SHEL:'shell.com',TTE:'totalenergies.com',NVO:'novonordisk.com',
NVDA:'nvidia.com',AXP:'americanexpress.com',BAC:'bankofamerica.com',INTC:'intel.com',
TM:'toyota.com',ASML:'asml.com',PBR:'petrobras.com.br',VALE:'vale.com',IRSA:'irsa.com.ar',
CRES:'cresud.com.ar',SBUX:'starbucks.com',ETH:'ethereum.org',BTC:'bitcoin.org'};

const nf=(n,d)=>Math.abs(n||0).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fUSD=(n,d=2)=>(n<0?'−':'')+'US$ '+nf(n,d);
const fUSD0=n=>(n<0?'−':'')+'US$ '+Math.abs(n||0).toLocaleString('es-AR',{maximumFractionDigits:0});
const fPct=n=>(n>0?'+':n<0?'−':'')+nf(n,2)+'%';
const fCant=n=>Math.abs(n)>=1000?nf(n,0):Math.abs(n)>=1?nf(n,2):nf(n,4);
const fFecha=s=>String(s||'').replace(/\/\d{2}(\d{2})$/,'/$1');
const cls=n=>n>0?'up':n<0?'dn':'';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function logo(tk){
  const d=DOM[tk], ini=esc(tk).slice(0,5);
  if(!d) return '<div class="av">'+ini+'</div>';
  return '<img class="lo" alt="" loading="lazy" src="https://logo.clearbit.com/'+d+'" '+
    'onerror="this.onerror=null;this.src=\'https://www.google.com/s2/favicons?sz=64&amp;domain='+d+'\';'+
    'this.dataset.f=(this.dataset.f||0)+1;if(this.dataset.f>1){this.outerHTML=\'<div class=&quot;av&quot;>'+ini+'</div>\'}">';
}

/* ---------- helpers de vista ----------
   Cartera               -> precio de la acción entera (Yahoo)
   Patrimonio e Histórico -> precio implícito por CEDEAR (IOL × ratio), igual
                             que la planilla

   El Histórico va por CEDEAR porque es la valuación con la que se llevan las
   cuentas: lo que cobrás si vendés acá. Las posiciones sin CEDEAR (ON, bonos,
   cripto) caen igual al precio de mercado, porque ahí los campos `Ced` se
   completan con los `Vivo`. */
const ced=()=>vista==='patrimonio'||vista==='historico';
const vivo=p=>ced()?(p.valorCed!=null?p.valorCed:p.valorActual)
                   :(p.precioVivo?p.valorVivo:p.valorActual);
const pnlDe=p=>ced()?(p.pnlCed!=null?p.pnlCed:p.pnl)
                    :(p.precioVivo?p.pnlVivo:p.pnl);
const rendDe=p=>ced()?(p.rendCed!=null?p.rendCed:p.rend)
                     :(p.precioVivo?p.rendVivo:p.rend);
const precioDe=p=>ced()?(p.precioCed||p.precioActual):(p.precioVivo||p.precioActual);
const enVivo=p=>ced()?!!p.precioCedRaw:!!p.precioVivo;

function totalPosiciones(){ return (D.posiciones||[]).reduce((a,p)=>a+vivo(p),0); }
function totalCosto(){ return (D.posiciones||[]).reduce((a,p)=>a+p.costo,0); }

/* ---------- ajuste a precios de hoy ----------
   Las hojas generadas (Dashboard, P&L por Activo) son una foto: el P&L de una
   posición que sigue abierta se calculó con el precio que tenía la planilla el
   día que corriste el script. Acá se le resta ese no realizado viejo y se le
   suma el de ahora, así todo se mueve con los precios en vivo sin tener que
   regenerar nada desde la computadora.

   El delta usa la valuación de la pestaña en la que estés: por CEDEAR en
   Patrimonio, por acción entera en Cartera e Histórico. */
/* Si estamos valuando por CEDEAR y justo ese CEDEAR no cotizó, `pnlCed` cae a
   `pnlVivo`, que es la acción entera: ajustar con eso cambiaría la base de
   valuación sin avisar. En ese caso no se ajusta y queda el valor de la hoja. */
function ajustable(p){
  if(!ced()) return true;
  const esCed=(p.tipo||'').toLowerCase().includes('cedear');
  return !esCed || !!p.precioCedRaw;
}
function deltaDe(p){ return ajustable(p) ? pnlDe(p)-(p.pnl||0) : 0; }

function deltasPorTicker(){
  const m={};
  (D.posiciones||[]).forEach(p=>{ m[p.ticker.toUpperCase()]=deltaDe(p); });
  return m;
}
function deltaVivo(){
  return (D.posiciones||[]).reduce((a,p)=>a+deltaDe(p),0);
}

/** El histórico con las posiciones abiertas revaluadas al precio de ahora. */
function historicoVivo(){
  const d=deltasPorTicker();
  return (D.historico||[]).map(x=>{
    const ajuste=d[x.ticker.toUpperCase()];
    if(!ajuste) return x;
    const pb=x.pnlBruto+ajuste, pn=x.pnlNeto+ajuste;
    return Object.assign({},x,{ pnlBruto:pb, pnlNeto:pn,
      rendBruto:x.invertido?pb/x.invertido*100:x.rendBruto,
      rendNeto: x.invertido?pn/x.invertido*100:x.rendNeto });
  });
}

/** Mejores y peores, recalculados sobre el histórico vivo. */
function topsVivos(h){
  const ord=h.slice().sort((a,b)=>b.pnlNeto-a.pnlNeto);
  return { win:ord.filter(x=>x.pnlNeto>0).slice(0,6),
           los:ord.filter(x=>x.pnlNeto<0).reverse().slice(0,6) };
}

/** P&L por clase de activo, también sobre el histórico vivo. */
function clasesVivas(h){
  const m={};
  h.forEach(x=>{
    const k=x.clase||'Otros';
    if(!m[k]) m[k]={clase:k,pnlNeto:0,capital:0,rentas:0};
    m[k].pnlNeto+=x.pnlNeto; m[k].capital+=x.invertido; m[k].rentas+=x.rentas;
  });
  return Object.keys(m).map(k=>{
    const c=m[k];
    c.rendNeto=c.capital?c.pnlNeto/c.capital*100:0;
    return c;
  }).sort((a,b)=>b.pnlNeto-a.pnlNeto);
}

function totales(){
  const t=D.totales;
  if(vista==='patrimonio'){
    // Arriba, en grande, los activos totales; el patrimonio neto va en la
    // tarjeta de abajo. "dif" ajusta por la diferencia entre el valor que
    // tiene la planilla y el que traen los precios en vivo.
    const dif=totalPosiciones()-t.subtotalValor;
    return { titulo:'Activos totales', valor:(t.totalCartera||0)+dif,
      pnl:(D.resumen.pnlNetoTotal||0)+deltaVivo(), pct:null,
      minis:[['Patrimonio neto',fUSD0((t.patrimonioNeto||0)+dif)],['Deudas',fUSD0(t.deudas)]] };
  }
  // Cartera: solo lo invertido a valor de hoy. El efectivo no se suma acá,
  // queda para Patrimonio; sigue visible en la tarjeta "Disponible".
  const val=totalPosiciones();
  const pnl=(D.posiciones||[]).reduce((a,p)=>a+pnlDe(p),0);
  const costo=totalCosto();
  return { titulo:'Valor de la cartera', valor:val, pnl:pnl, pct:costo?(pnl/costo)*100:0,
    minis:[['Invertido',fUSD0(costo)],['Disponible',fUSD0(t.cash)]] };
}

/* Orden de la lista de posiciones. Los tres criterios usan la valuación de la
   pestaña en la que estés, así que en Patrimonio ordena por CEDEAR. */
function ordenarPosiciones(ps){
  const c=ps.slice();
  if(ordenPos==='pnl')  return c.sort((a,b)=>pnlDe(b)-pnlDe(a));
  if(ordenPos==='rend') return c.sort((a,b)=>rendDe(b)-rendDe(a));
  return c.sort((a,b)=>vivo(b)-vivo(a));
}

/** Aviso de qué precio se está usando en cada pestaña. */
function nota(){
  if(vista==='historico') return '';
  return ced()
    ? 'Valuado con el precio del CEDEAR local, igual que tu planilla.'
    : 'Valuado con el precio de la acción entera en el mercado de origen.';
}

/* Renta fija: obligaciones negociables, bonos, ETFs de bonos y FCI.
   Todo lo demás (CEDEARs, acciones y cripto) cuenta como renta variable.
   Si algún día sumás un ETF de acciones, hay que afinar esta línea. */
const esRentaFija=tipo=>{
  const t=(tipo||'').toLowerCase();
  return t.includes('obligaci')||t.includes('bono')||t.includes('etf')||t.includes('fci');
};

/** Nombre del tipo de activo tal como se muestra en el donut de Cartera. */
function nombreTipo(tipo){
  const t=(tipo||'').toLowerCase();
  return t.includes('cedear')   ? 'Acciones / CEDEARs'
       : t.includes('obligaci') ? 'Oblig. Negociables'
       : t.includes('bono')     ? 'Bonos'
       : t.includes('cripto')   ? 'Criptomonedas'
       : t.includes('fci')      ? 'FCI'
       : t.includes('etf')      ? 'ETF'
       : t.includes('acci')     ? 'Acciones'
       : (tipo||'Otros');
}

/* Los grupos se recalculan con los valores en vivo para que el donut
   coincida siempre con el número grande de arriba.

   Cartera    -> por tipo de activo. Sin efectivo, porque tampoco está en el total.
   Patrimonio -> Renta Variable, Renta Fija, Disponible y Autos.

   Los grupos que dan cero no se dibujan: hoy los autos están en 0 y por eso no
   aparecen; si volvés a cargar uno, se suma solo. */
function grupos(){
  const t=D.totales||{};
  const out=[];

  if(vista!=='patrimonio'){
    const mapa={};
    (D.posiciones||[]).forEach(p=>{
      const g=nombreTipo(p.tipo);
      mapa[g]=(mapa[g]||0)+vivo(p);
    });
    Object.keys(mapa).forEach(k=>{ if(mapa[k]) out.push({grupo:k,valor:mapa[k]}); });
    return out.sort((a,b)=>b.valor-a.valor);
  }

  let rv=0, rf=0;
  (D.posiciones||[]).forEach(p=>{ if(esRentaFija(p.tipo)) rf+=vivo(p); else rv+=vivo(p); });
  if(rv)      out.push({grupo:'Renta Variable',valor:rv});
  if(rf)      out.push({grupo:'Renta Fija',valor:rf});
  if(t.cash)  out.push({grupo:'Disponible',valor:t.cash});
  if(t.autos) out.push({grupo:'Autos',valor:t.autos});
  return out.sort((a,b)=>b.valor-a.valor);
}

/** Detalle de una fila del histórico (sirve para abiertas y cerradas). */
/* Todas las compras del ticker, abiertas y cerradas, en orden cronológico.
   La que sigue abierta no tiene precio de venta: ahí se distingue. */
function tablaOperaciones(ticker){
  const ops=(D.operacionesHist&&D.operacionesHist[ticker.toUpperCase()])||[];
  if(!ops.length) return '';
  const ab=ops.filter(o=>o.abierta).length;

  /* Las operaciones cerradas ya tienen su resultado realizado y no se tocan.
     Las abiertas se revalúan al precio de ahora: el de la planilla se calculó
     el día que corriste el script. Como precioCompra y precioDe() están en la
     misma convención (por acción, o "por 100" en ON y bonos), alcanza con la
     variación entre los dos. Así la suma de la columna coincide siempre con el
     P&L que muestra el encabezado del ticker. */
  const p=(D.posiciones||[]).find(q=>q.ticker.toUpperCase()===ticker.toUpperCase());
  const prAhora=(p&&ajustable(p))?precioDe(p):0;
  const vivoDe=o=>{
    if(!o.abierta||!prAhora||!o.precioCompra) return {res:o.resultado,rend:o.rend};
    const v=prAhora/o.precioCompra-1;
    return {res:o.costo*v, rend:v*100};
  };
  const sub=ops.length+(ops.length===1?' operación':' operaciones')+
    (ab?' · '+ab+(ab===1?' abierta':' abiertas'):'');
  return '<h2 style="margin-left:0">Operaciones <span>'+sub+'</span></h2>'+
    '<div class="card" style="padding:4px 16px 12px"><table class="ops">'+
    '<thead><tr><th>Fecha</th><th>Cant.</th><th>Compra</th><th>Venta</th>'+
    '<th>Result.</th><th>Rend.</th></tr></thead><tbody>'+
    ops.map(o=>{
      const v=vivoDe(o);
      return '<tr'+(o.abierta?' class="viva"':'')+'>'+
      '<td>'+esc(fFecha(o.fecha))+'</td>'+
      '<td>'+fCant(o.cantidad)+'</td>'+
      '<td>'+nf(o.precioCompra,2)+'</td>'+
      '<td>'+(o.abierta?'<span class="na">—</span>':nf(o.precioVenta,2))+'</td>'+
      '<td class="'+cls(v.res)+'">'+(v.res>0?'+':v.res<0?'−':'')+nf(v.res,2)+'</td>'+
      '<td class="'+cls(v.rend)+'">'+fPct(v.rend)+'</td></tr>';
    }).join('')+
    '</tbody></table>'+
    '<div style="font-size:11px;color:var(--tx3);padding-top:9px;line-height:1.45">'+
    'Valores en US$. Las filas sin precio de venta son las que siguen abiertas: '+
    'ahí el resultado todavía no está realizado y se recalcula con el precio de ahora.'+
    '</div></div>';
}

/* De dónde sale el P&L que se muestra: el de la hoja, más el ajuste al precio
   de hoy. Sirve para poder auditar el número a simple vista. */
function origenDelPnl(x,p){
  if(!p) return '';
  const d=deltaDe(p);
  const base=x.pnlNeto-d;
  const fuente=ced()
    ? (p.precioCedRaw?'CEDEAR '+esc(p.tickerCed||'')+' a '+fUSD(p.precioCedRaw)+' × '+p.ratio
                     :'precio de mercado')
    : (p.fuenteVivo||'la planilla');
  if(!d) return '<div style="font-size:11.5px;color:var(--tx3);margin:-6px 4px 14px;line-height:1.5">'+
    'Sin ajuste: no llegó el precio del CEDEAR, así que se muestra el valor de la planilla.</div>';
  return '<div style="font-size:11.5px;color:var(--tx3);margin:-6px 4px 14px;line-height:1.5">'+
    'P&L de la planilla '+fUSD(base)+' · ajuste a precio de hoy '+
    '<span class="'+cls(d)+'">'+(d>0?'+':'')+fUSD(d)+'</span> · vía '+fuente+'</div>';
}

/* ---------- datos ---------- */
async function cargar(){
  const url=localStorage.getItem(K_URL), tok=localStorage.getItem(K_TOK);
  if(!url||!tok){mostrarSetup();return;}
  const b=$('refresh'); b.disabled=true; b.textContent='Actualizando…';
  $('err').innerHTML='';
  try{
    const r=await fetch(url+'?token='+encodeURIComponent(tok)+'&t='+Date.now(),{redirect:'follow'});
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||'Respuesta inválida');
    D=j; try{localStorage.setItem(K_DATA,JSON.stringify(j));}catch(e){}
    render();
  }catch(e){
    const cache=localStorage.getItem(K_DATA);
    if(cache&&!D){try{D=JSON.parse(cache);render();}catch(x){}}
    $('err').innerHTML='<div class="err">No se pudo actualizar: '+esc(e.message)+
      (cache?'<br>Mostrando los últimos datos guardados.':'')+'</div>';
  }finally{ b.disabled=false; b.textContent='Actualizar'; }
}

function mostrarSetup(editar){
  $('app').classList.add('hidden'); $('setup').classList.remove('hidden');
  $('inUrl').value=localStorage.getItem(K_URL)||'';
  $('inTok').value=localStorage.getItem(K_TOK)||'';
  $('cancel').classList.toggle('hidden',!editar);
}
function mostrarApp(){ $('setup').classList.add('hidden'); $('app').classList.remove('hidden'); }

$('save').onclick=async()=>{
  const u=$('inUrl').value.trim(), t=$('inTok').value.trim();
  $('setupErr').innerHTML='';
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u)){
    $('setupErr').innerHTML='<div class="err">La URL debe empezar con https://script.google.com/macros/s/ y terminar en /exec</div>';return;
  }
  if(!t){$('setupErr').innerHTML='<div class="err">Falta el token.</div>';return;}
  localStorage.setItem(K_URL,u); localStorage.setItem(K_TOK,t);
  mostrarApp(); await cargar();
};
$('cancel').onclick=()=>mostrarApp();
$('cfg').onclick=()=>mostrarSetup(true);
$('refresh').onclick=()=>cargar();
$('tabC').onclick=()=>cambiar('cartera');
$('tabP').onclick=()=>cambiar('patrimonio');
$('tabH').onclick=()=>cambiar('historico');
function cambiar(v){
  vista=v;
  $('tabC').setAttribute('aria-selected',v==='cartera');
  $('tabP').setAttribute('aria-selected',v==='patrimonio');
  $('tabH').setAttribute('aria-selected',v==='historico');
  if(D) render();
}
[['oV','valor'],['oA','pnl'],['oR','rend']].forEach(([id,val])=>{
  $(id).onclick=()=>{
    ordenPos=val;
    ['oV','oA','oR'].forEach((x,i)=>$(x).setAttribute('aria-pressed',['valor','pnl','rend'][i]===val));
    if(D) render();
  };
});
[['fT','todas'],['fA','abiertas'],['fC','cerradas']].forEach(([id,val])=>{
  $(id).onclick=()=>{
    filtroH=val;
    ['fT','fA','fC'].forEach((x,i)=>$(x).setAttribute('aria-pressed',['todas','abiertas','cerradas'][i]===val));
    renderHist();
  };
});

(function init(){
  const cache=localStorage.getItem(K_DATA);
  if(localStorage.getItem(K_URL)&&localStorage.getItem(K_TOK)){
    mostrarApp();
    if(cache){try{D=JSON.parse(cache);render();}catch(e){}}
    cargar();
  }else mostrarSetup();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
